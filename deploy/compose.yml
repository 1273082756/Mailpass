name: mailpass

services:
  backend:
    image: mailpass-backend:__VERSION__
    pull_policy: never
    env_file: .env
    environment:
      SITE_NAME: ${SITE_NAME:-Mailpass}
      MAIL_DOMAINS: ${MAIL_DOMAINS:?Set MAIL_DOMAINS in .env}
      DATABASE_PATH: /data/tempmail.db
      SMTP_HOST: 0.0.0.0
      SMTP_PORT: 2525
      SMTP_ENABLED: ${SMTP_ENABLED:-true}
      MAX_MESSAGE_SIZE: ${MAX_MESSAGE_SIZE:-15728640}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ACCESS_KEY: ${ACCESS_KEY:-}
    ports:
      - "${SMTP_PORT:-25}:2525"
    volumes:
      - mail_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    image: mailpass-frontend:__VERSION__
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  mail_data:
